name: JM merch data

# Refreshes the merch dashboard's Notion snapshots in jmmerch-dashboard/data/.
# Runs every 3 hours, and on demand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jmmerch-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull Notion databases
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/jmmerch-sync.mjs

      - name: Commit changed snapshots
        if: always()
        run: |
          git config user.name "jmmerch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jmmerch-dashboard/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "JM merch data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
