<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>John Muirhead Merch</title>
<style>
:root {
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --color-bg: #faf9f6;
  --color-panel: #f0eee8;
  --color-fg: #1f1e1b;
  --color-fg-muted: #6b6860;
  --color-border-line: #e2dfd7;
  --color-accent: #3b6fd8;
  --color-ok: #2e8b57;
  --color-warn: #c98a12;
  --color-bad: #c8423a;
  --cds-font-size-caption: 12px;
  --cds-font-size-body: 14px;
  --cds-font-size-title: 22px;
  --cds-font-weight-medium: 600;
  --cds-radius: 8px;
  --cds-gap-sm: 8px;
  --cds-gap-md: 12px;
  --cds-gap-lg: 20px;
  --cds-gap-xl: 28px;
  --cds-pad-md: 12px;
  --cds-pad-lg: 20px;
  --cds-border: #e2dfd7;
  --cds-text-secondary: #6b6860;
  --cds-surface-popover: #ffffff;
  --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .12);
  --cds-chart-axis: #8d897f;
  --cds-chart-grid: #e8e5de;
  --cds-chart-muted: #b9b5ab;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #1c1b19;
    --color-panel: #2a2926;
    --color-fg: #ecebe6;
    --color-fg-muted: #a19d94;
    --color-border-line: #3a3834;
    --color-ok: #4cb37a;
    --color-warn: #e0a83a;
    --color-bad: #e06a60;
    --cds-border: #3a3834;
    --cds-text-secondary: #a19d94;
    --cds-surface-popover: #2a2926;
    --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .5);
    --cds-chart-axis: #8d897f;
    --cds-chart-grid: #34322e;
    --cds-chart-muted: #5c5952;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-bg: #1c1b19; --color-panel: #2a2926; --color-fg: #ecebe6; --color-fg-muted: #a19d94; --color-border-line: #3a3834;
  --color-ok: #4cb37a; --color-warn: #e0a83a; --color-bad: #e06a60; --cds-border: #3a3834; --cds-text-secondary: #a19d94;
  --cds-surface-popover: #2a2926; --cds-shadow-popover: 0 4px 16px rgba(0, 0, 0, .5); --cds-chart-grid: #34322e; --cds-chart-muted: #5c5952;
  color-scheme: dark;
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.45; }
#dash-root { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
.dash-select { font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 5px 8px; }
.dash-boot { color: var(--color-fg-muted); padding: 40px 0; text-align: center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="runtime.js?v=2" defer></script>
</head>
<body>
<div id="dash-root"><p class="dash-boot">Loading dashboard…</p></div>
</body>
</html>
