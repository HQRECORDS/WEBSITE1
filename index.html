<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ Records</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="HQ Records — a record label.">
<style>
  :root {
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 5vw;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .logo {
    width: 100%;
    max-width: 340px;
    height: auto;
    display: block;
  }

  @media (max-width: 420px) {
    .logo {
      max-width: 260px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <video class="logo" src="logo-animated.mp4" poster="logo-animated-poster.jpg"
           autoplay muted loop playsinline disablepictureinpicture
           width="540" height="752" aria-label="HQ Records logo"></video>
  </div>
</body>
</html>
